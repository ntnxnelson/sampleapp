# NGINX site for the Peaks demo web tier.
#
# Serves the static page from /var/www/peaks and reverse-proxies /api/ to the
# Node.js tier, so the browser only ever talks to this server.
#
# NODEJS_IP_ADDRESS is replaced with the Node.js VM address by setup.sh.

upstream peaks_api {
    server NODEJS_IP_ADDRESS:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/peaks;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://peaks_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
